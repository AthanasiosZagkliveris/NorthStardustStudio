# Every push: the typecheck, the tests, the build and the fast checks that need no browser (the same as npm run verify).
# Pull requests to main and runs started by hand: the layout check too, in its own job.
# See docs/ai/toolchain-and-verification-playbook.md, "Continuous integration".
name: CI

# "on" is quoted so strict YAML 1.1 readers do not read it as true.
"on":
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci installs exactly what package-lock.json pins.
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Must exit 0: a hard gate (the playbook lists no expected failures today).
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The style, token, CSS, documents, tables and library checks: fast, no browser, deterministic.
      - name: Tokens
        run: npm run tokens:check
      - name: Style lint
        run: npm run lint:styles
      - name: Shared-control lint
        run: npm run lint:controls
      - name: Boundaries
        run: npm run lint:boundaries
      - name: CSS lint
        run: npm run lint:css
      - name: Documents
        run: npm run docs:check
      - name: Tables
        run: npm run tables:check
      - name: Library
        run: npm run library:check

  # THE LAYOUT CHECK needs a browser, so it is its own job: on pull requests to main and when started by hand, alone on its machine (it starts the dev server itself).
  layout:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Layout check
        run: npm run check:layout
